spring.application.name=inventory-management

# Server
server.port=8080

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_management
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# IMPORTANT: Replace jwt.secret with a strong random secret before deploying to production.
# The secret must be at least 32 characters (256 bits) for HS256.
# Do NOT commit real production secrets to version control.
jwt.secret=ChangeThisToAStrongSecretKeyAtLeast32CharsLong!
jwt.expiration=3600000
jwt.issuer=inventory-management
